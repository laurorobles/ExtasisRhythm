name: Build Extasis Rhythm (Windows & macOS)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (x64)
            os: windows-latest
            artifact_name: ExtasisRhythm-Windows
            cmake_args: -DCMAKE_BUILD_TYPE=Release -DJUCE_COPY_PLUGIN_AFTER_BUILD=FALSE
          - name: macOS (Universal)
            os: macos-latest
            artifact_name: ExtasisRhythm-macOS
            cmake_args: -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DJUCE_COPY_PLUGIN_AFTER_BUILD=FALSE

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC Developer Command Prompt (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Ninja
        uses: ashley-taylor/setup-ninja@v1.0.0

      - name: Configure CMake
        run: |
          cmake -B build -G "Ninja" ${{ matrix.cmake_args }}

      - name: Build Plugin & Standalone
        run: |
          cmake --build build --config Release --parallel

      - name: Prepare Windows Artifacts
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p artifacts/VST3 artifacts/Standalone
          find build -name "*.vst3" -exec cp -r {} artifacts/VST3/ \; || true
          find build -name "*.exe" ! -name "vst3_helper.exe" -exec cp {} artifacts/Standalone/ \; || true

      - name: Prepare macOS Artifacts
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p artifacts/VST3 artifacts/Standalone
          find build -name "*.vst3" -exec cp -r {} artifacts/VST3/ \; || true
          find build -name "*.app" -exec cp -r {} artifacts/Standalone/ \; || true

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: artifacts/
