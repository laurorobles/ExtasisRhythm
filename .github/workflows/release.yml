name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-13, windows-latest, ubuntu-22.04]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Install Linux Dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev libx11-dev libxinerama-dev libxext-dev libfreetype6-dev libwebkit2gtk-4.0-dev libglu1-mesa-dev libjack-jackd2-dev libcurl4-openssl-dev

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --config Release --parallel 4

    - name: Package macOS
      if: runner.os == 'macOS'
      run: |
        mkdir -p ExtasisRhythm-macOS
        cp -R build/ExtasisRhythm_artefacts/Release/VST3/ExtasisRhythm.vst3 ExtasisRhythm-macOS/
        cp -R build/ExtasisRhythm_artefacts/Release/Standalone/ExtasisRhythm.app ExtasisRhythm-macOS/ || true
        zip -r ExtasisRhythm-macOS.zip ExtasisRhythm-macOS/

    - name: Package Windows
      if: runner.os == 'Windows'
      shell: bash
      run: |
        mkdir -p ExtasisRhythm-Windows
        cp -R build/ExtasisRhythm_artefacts/Release/VST3/ExtasisRhythm.vst3 ExtasisRhythm-Windows/
        cp build/ExtasisRhythm_artefacts/Release/Standalone/ExtasisRhythm.exe ExtasisRhythm-Windows/ || true
        powershell -Command "Compress-Archive -Path ExtasisRhythm-Windows -DestinationPath ExtasisRhythm-Windows.zip"
        
    - name: Package Linux
      if: runner.os == 'Linux'
      run: |
        mkdir -p ExtasisRhythm-Linux
        cp -R build/ExtasisRhythm_artefacts/Release/VST3/ExtasisRhythm.vst3 ExtasisRhythm-Linux/
        cp build/ExtasisRhythm_artefacts/Release/Standalone/ExtasisRhythm ExtasisRhythm-Linux/ || true
        zip -r ExtasisRhythm-Linux.zip ExtasisRhythm-Linux/

    - name: Upload Artifact
      uses: actions/upload-artifact@v3
      with:
        name: ExtasisRhythm-${{ runner.os }}
        path: ExtasisRhythm-*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Download Artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*.zip
          name: Extasis Rhythm ${{ github.ref_name }}
          body: |
            ## Extasis Rhythm 2.6
            * **FFT Smart Auto-Tagging**
            * **True 12-Bit PCM Sample-and-Hold**
            * **Offline Key Validation**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
